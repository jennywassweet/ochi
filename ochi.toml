# ochi configuration. Secrets (DISCOGS_TOKEN) go to .env, not here.

[chrome]
# Chrome / Chromium / Brave / Edge binary (any Chromium-based browser)
path = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
# separate profile: only logins ochi needs live here
profile = "~/.ochi-profile"
port = 9222
# start the browser automatically when a tool needs it and it isn't running
autostart = true
# extra command-line flags
args = ["--no-first-run", "--no-default-browser-check"]
