[project]
name = "ochi"
version = "0.2.0"
description = "MCP server that reads web pages through your own Chrome via per-site extractor scripts"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jennywassweet" }]
requires-python = ">=3.11"
keywords = ["mcp", "chrome", "cdp", "playwright", "scraping", "discogs"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2,<2",
    "playwright>=1.45",
]

[project.urls]
Homepage = "https://github.com/jennywassweet/ochi"

[project.scripts]
ochi = "ochi.server:main"
ochi-try = "ochi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ochi"]

# installed copies (uvx / pip) carry the built-in extractors and the examples for `ochi init`
[tool.hatch.build.targets.wheel.force-include]
"extractors" = "ochi/data/extractors"
"ochi.example.toml" = "ochi/data/ochi.example.toml"
".env.example" = "ochi/data/env.example"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: needs a headless Chromium (Playwright's or an installed Chrome)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
