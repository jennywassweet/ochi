[project]
name = "ochi"
version = "0.1.0"
description = "Eyes on the web: MCP server that reads pages through your own Chrome via per-site extractor scripts"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "playwright>=1.45",
]

[project.scripts]
ochi = "ochi.server:main"
ochi-try = "ochi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ochi"]
